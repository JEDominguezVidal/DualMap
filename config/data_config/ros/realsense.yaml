dataset_name: 'realsense'

ros_topics:
  rgb: "/camera/camera/color/image_raw"
  #depth: "/camera/camera/aligned_depth_to_color/image_raw"
  depth: "/cdm/depth_enhanced"
  odom: "/camera/pose"
  camera_info: "/camera/camera/color/camera_info"

pose_represents: "camera_frame"

# Depth factor: divisor to convert depth values to meters
# - For 16UC1 (uint16) depth in millimeters (e.g., RealSense, Orbbec): use 1000.0
# - For 32FC1 (float32) depth in meters (e.g., Isaac Sim, Gazebo): use 1.0
depth_factor: 1000.0

# intrinsic:
#   # fx: 916.39111328125
#   # fy: 646.473876953125
#   # cx: 914.662353515625
#   # cy: 363.88116455078125
#   fx: 610.9274291992188
#   fy: 324.31591796875
#   cx: 609.77490234375
#   cy: 242.5874481201172

# No extrinsics are configured because /camera/pose is assumed to already be the
# camera pose in the optical frame used by RGB and aligned depth.
