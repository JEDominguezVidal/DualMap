dataset_name: 'realsense_tf'

ros_topics:
  # Topic name for RGB images (sensor_msgs/Image or CompressedImage)
  rgb: "/camera/color/image_raw"
  # Topic name for Depth images (sensor_msgs/Image or CompressedImage)
  depth: "/camera/aligned_depth_to_color/image_raw"
  # Topic name for CameraInfo (sensor_msgs/CameraInfo)
  # Optional if 'intrinsic' is manually defined below.
  camera_info: "/camera/color/camera_info"
  # NOTE: No 'odom' topic defined — the system will use TF mode instead.

pose_represents: "camera_frame"

# TF Configuration
# The runner will obtain the camera pose by looking up the transform
# between these two frames at each synchronised image timestamp.
# Use 'ros2 run tf2_tools view_frames' while playing your rosbag
# to identify the correct frame names.
tf_world_frame: "moca_red_franka_base_link"     # Fixed/world frame
tf_camera_frame: "camera_color_optical_frame"   # Optical camera frame

# Depth factor: divisor to convert depth values to metres
# - For 16UC1 (uint16) depth in millimetres (e.g., RealSense, Orbbec): use 1000.0
# - For 32FC1 (float32) depth in metres (e.g., Isaac Sim, Gazebo): use 1.0
depth_factor: 1000.0

# No extrinsics are needed here because TF already provides the camera pose.
