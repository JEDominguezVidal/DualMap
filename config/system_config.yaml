defaults:
  - base_config
  - support_config/demo_config@_here_
  - _self_

# ============================================================
# MODEL CONFIG
# ============================================================
# These parameters configure the AI models used for object detection,
# segmentation, and feature extraction. Changing the model variant
# (e.g., from mobile_sam to sam_l) trades speed for accuracy.
# Changing the class list determines WHICH objects the system looks for.
# Example: Switch to gpt_outdoor_general.txt for outdoor robotics.
# ============================================================
yolo:
  _target_: _self_
  # Path to the YOLOv8-World model weights file
  model_path: model/yolov8l-world.pt
  # Path to GT class names file (auto-generated for dataset evaluation)
  # This file is generated by: applications/generate_replica_class_color
  classes_path: ${output_path}/${dataset_name}_${scene_id}/classes_info/${dataset_name}_${scene_id}_names.txt
  # List of background classes that will be ignored during detection
  bg_classes: ["wall", "floor", "ceiling", "desk"]
  # Whether to skip background class detections entirely
  skip_bg: False

  # Whether to use a predefined class list (True) or ground truth classes from the dataset (False).
  # Set to True for custom ROS/rosbag deployments where you define what objects to detect.
  # Set to False for dataset evaluation (e.g., Replica, ScanNet) where GT classes exist.
  # IMPORTANT: The offline query tool (offline_local_map_query.py) must use the same
  # setting and class list that was used when generating the map, otherwise class IDs
  # will not match and you will see "Unknown_Class" labels.
  use_given_classes: True

  ## The given classes lists
  ## Indoor Classes List
  # given_classes_path: ./config/class_list/hm3d300_classes_ycb.txt
  given_classes_path: ./config/class_list/gpt_rosbag_indoor_lab_desk_3.txt
  # given_classes_path: ./config/class_list/gpt_rosbag_indoor_lab.txt
  # given_classes_path: ./config/class_list/gpt_indoor_office.txt
  # given_classes_path: ./config/class_list/gpt_indoor_apartment.txt
  # given_classes_path: ./config/class_list/gpt_indoor_classroom.txt

  ## Outdoor Classes List
  # given_classes_path: ./config/class_list/gpt_outdoor_general.txt

  ## Dataset Classes List (_ycb add the classes from YCB)
  # given_classes_path: ./config/class_list/hm3d300_classes.txt
  # given_classes_path: ./config/class_list/hm3d300_classes_ycb.txt
  # given_classes_path: ./config/class_list/scannet200_classes.txt

  # Internal counter for the Bayesian stable filter. Auto-populated at runtime from the
  # class list length. Do not set manually.
  num_classes: 0

sam:
  _target_: _self_
  # SAM segmentation model weights. mobile_sam is faster; sam_l is more accurate.
  # model_path: model/sam_l.pt
  model_path: model/mobile_sam.pt

fastsam:
  _target_: _self_
  # FastSAM model weights for fast open-vocabulary supplementation
  model_path: model/FastSAM-s.pt

clip:
  _target_: _self_
  # CLIP model variant for visual-semantic feature extraction.
  # MobileCLIP2-S2 is fast and suitable for real-time robotics.
  # ViT-H-14 is more accurate but significantly slower.
  model_name:  MobileCLIP2-S2
  # model_name: MobileCLIP-S2
  # model_name: ViT-H-14
  # Pretrained weights identifier for the CLIP model
  pretrained: dfndr2b
  # pretrained: datacompdr
  # pretrained: laion2b_s32b_b79k
  # Dimensionality of the CLIP feature vector. Must match the chosen model.
  # MobileCLIP2 S0/S2 = 512, MobileCLIP2 S3/S4/L-14 = 768, ViT-H-14 = 1024
  clip_length: 512
  # clip_length: 1024
  # Batch size for CLIP feature extraction to avoid OOM
  clip_batch_size: 32
  # Batch size for Point Cloud (PCD) generation to avoid OOM.
  # Can be adjusted along with clip_batch_size for VRAM optimization.
  pcd_batch_size: 32


# Compute device for inference: "cuda" for GPU, "cpu" for CPU-only
device: cuda


# ============================================================
# DUALMAP CONFIG
# ============================================================

# -------------------------------------------------------
# VISUALISATION
# -------------------------------------------------------
# Controls whether real-time visualisation is displayed via Rerun.
# Disable for headless servers or batch processing to save resources.
use_rerun: True
# Controls whether DualMap tries to open the native Rerun viewer process.
# Disable this in Docker if you want to connect manually from the host with:
#   rerun --connect rerun+http://127.0.0.1:9876/proxy
spawn_rerun_viewer: True


# -------------------------------------------------------
# OBSERVATION GENERATION
# -------------------------------------------------------
# These settings control how raw sensor data is converted into 3D object
# observations (point clouds with semantic labels and CLIP features).
# Tuning these affects detection quality, speed, and disk usage.
# Example: Disable run_detection and set save_detection to load cached
# detections for faster re-runs of the same rosbag.

## General Detection Settings
# Enable object detection during mapping (False = load cached detections from disk)
run_detection: True
# Save detection results to disk for later re-use
save_detection: True
# Directory for saving and loading cached detections
detection_path: ${output_path}/${dataset_name}_${scene_id}/detections
# Show 2D detection results overlaid on camera images in Rerun during runtime
visualize_detection: True
# Show overlapping 3D bounding boxes on Rerun (significantly slower performance)
show_3d_bbox_overlapped: False


## FastSAM Settings
# FastSAM supplements YOLO detections with open-vocabulary segmentation masks
# for objects that YOLO may miss. Enabling it improves recall at the cost of speed.
# Use FastSAM for Open-Vocabulary supplementation
use_fastsam: True
# FastSAM operating mode:
#   full = legacy behaviour
#   uncovered_only = only keep masks that add enough novel pixels beyond YOLO/SAM
#   off = disable FastSAM supplementation entirely
fastsam_mode: uncovered_only
# Conservative defaults for tabletop rosbag runs. The goal is to keep only a
# small number of genuinely novel masks and avoid flooding the unified filter.
fastsam_uncovered_max_masks: 12
# Reserve a very small number of truly tiny masks for tabletop parts that are
# fully novel but lose against larger FastSAM masks in the main ranking.
fastsam_uncovered_small_mask_quota: 2
fastsam_uncovered_small_mask_min_pixels: 180
fastsam_uncovered_small_mask_max_pixels: 260
fastsam_uncovered_small_ignore_border_px: 4
fastsam_uncovered_small_min_bbox_width: 10
fastsam_uncovered_small_min_bbox_height: 10
fastsam_uncovered_max_area_ratio: 0.12
fastsam_uncovered_min_mask_pixels: 80
fastsam_uncovered_min_novel_pixels: 150
fastsam_uncovered_min_novel_ratio: 0.55
# Minimum confidence threshold for FastSAM detections (0.0 to 1.0)
fastsam_confidence: 0.50
# Display FastSAM debug outputs on Rerun (masks, bounding boxes)
show_fastsam_debug: False
# Whether to restrict promotion of "unknown" objects to the global map.
# Set to False to allow FastSAM objects to be saved even if not identified by YOLO.
restrict_unknown_labels: false


## Detection Refinement
# SAM-based mask refinement polishes YOLO bounding-box detections into precise masks.
# Skipping refinement is faster but produces noisier point clouds.
# Skip refinement will be faster but less accurate
skip_refinement: False
# Minimum number of pixels for a valid detection mask. Detections with fewer pixels
# are discarded as noise. Increase for distant/small objects to be filtered out.
small_mask_th: 20


## Feature Settings
# These control how the CLIP feature vector for each object is computed.
# A weighted combination of image (visual) and text (class label) features
# produces more robust object descriptors for matching and querying.
# Example: Set image_weight to 1.0 for purely visual matching,
# or 0.0 for purely text-based matching.
# Use Text and Image weighted feats for object feature
# text_weight = 1 - image_weight
use_weighted_feature: True
# Weight given to the image-based CLIP feature (0.0 to 1.0).
# The text weight is automatically calculated as (1 - image_weight).
# Higher values rely more on visual appearance; lower values rely more on class labels.
image_weight: 0.7
# Use average feat for unknown classes detected by FastSAM
use_avg_feat_for_unknown: True

# Optional CLIP-based relabeling for FastSAM detections that remain "unknown".
# The relabeling compares the image embedding of each unknown crop against the
# text embeddings of the active class list and promotes the best match only when
# the similarity is both high enough and sufficiently separated from the runner-up.
clip_unknown_relabel:
  enabled: true
  min_similarity: 0.05
  min_margin: 0.01
  exclude_bg_classes: true
  exclude_unknown_label: true
  use_image_features_only: true
  save_debug_scores: false

# In rosbag_tf/tabletop mode, FastSAM masks remain as unknown by default to
# avoid semantic flicker from CLIP relabeling.
clip_relabel_fastsam: false


# -------------------------------------------------------
# POINT CLOUD (PCD) SETTINGS
# -------------------------------------------------------
# These parameters control how 3D point clouds are generated, filtered,
# and maintained for each detected object. They directly affect the
# quality and density of the 3D reconstruction.
# Example: Increase downsample_voxel_size from 0.01 to 0.03 for faster
# processing with coarser point clouds. Decrease dbscan_eps to break
# apart loosely connected clusters of points.

## PCD Settings
# Minimum number of 3D points required for a valid object point cloud.
# Detections that produce fewer points (e.g. very distant or occluded objects)
# are discarded entirely. Increase to filter out unreliable small detections.
min_points_threshold: 5
# Voxel grid size (in metres) for periodic point cloud downsampling within each object.
# Smaller values preserve more detail but consume more memory.
# Also used as the distance threshold in the spatial similarity tracker (FAISS).
downsample_voxel_size: 0.01
# Whether to apply DBSCAN clustering to remove noise/outlier points from each observation.
# Recommended True for monocular depth (e.g. Depth Anything), which tends to produce noisy edges.
dbscan_remove_noise: !!bool True
# DBSCAN neighbourhood radius (in metres). Points further apart than this are not considered
# neighbours. Smaller values = stricter clustering = more noise removed but risk losing thin structures.
dbscan_eps: 0.10
# DBSCAN minimum cluster size. Clusters with fewer points are classified as noise and removed.
dbscan_min_points: 5
# Fraction of depth pixels to sample when projecting masks to 3D points (0.0 to 1.0).
# Lower values (e.g. 0.05) produce sparser but faster point clouds.
# Higher values (e.g. 0.5) produce denser, more accurate clouds at the cost of speed.
pcd_sample_ratio: 0.10
# If True, discard observations whose point cloud clustering is ambiguous.
# Disabled by default because it has not been useful in the recent rosbag_tf runs.
discard_ambiguous_clusters: false


# -------------------------------------------------------
# ICP ALIGNMENT SETTINGS
# -------------------------------------------------------
# When the same object is observed from multiple frames, each observation's
# point cloud arrives with slight positional errors due to odometry drift
# and depth noise. ICP (Iterative Closest Point) aligns the new observation
# to the accumulated object model before merging, reducing "ghosting".
# NOTE: ICP operates WITHIN a single tracked object. If the tracker creates
# two separate objects for the same physical thing, ICP cannot help — use
# merge_local_map (below) to fix that.
# Example: Disable ICP (use_icp_alignment: False) for perfectly calibrated
# setups with stereo depth cameras where odometry is very accurate.

# Enable ICP point cloud alignment before merging observations into tracked objects
use_icp_alignment: True
# Voxel size (in metres) for downsampling both point clouds before running ICP.
# Larger values = faster ICP but coarser alignment. Should be >= downsample_voxel_size.
icp_voxel_size: 0.05
# Maximum correspondence distance (in metres) for ICP. Point pairs further apart
# than this are ignored during alignment. Increase if odometry drift between frames
# is large (e.g. 0.4 for wheel odometry). Decrease for high-accuracy setups.
icp_distance_threshold: 0.10
# Minimum number of points (after downsampling) required in BOTH the source and
# target clouds to attempt ICP. Below this threshold, ICP is skipped to avoid
# unreliable alignment from too few points.
icp_min_points: 10
# Minimum ICP fitness score (0.0 to 1.0) required to accept the alignment.
# Fitness = fraction of source points that found a correspondence within
# icp_distance_threshold. Higher values = stricter acceptance = fewer false alignments
# but more cases where ICP is skipped. 0.3 is permissive; 0.8 is strict.
icp_fitness_threshold: 0.3

# -------------------------------------------------------
# OBJECT GEOMETRY UPDATE SETTINGS
# -------------------------------------------------------
# Controls how a tracked object's canonical 3D point cloud is updated when the
# same object is observed again.
#   auto = hybrid for rosbag_tf, append for other datasets
#   append = legacy behaviour; keep accumulating points over time
#   replace = replace the object's geometry with the newest observation
#   hybrid = use the newest observation as reference and only merge if the
#            historical cloud aligns with high confidence; otherwise replace
object_geometry_update_mode: auto
# ICP voxel size used by the hybrid geometry update. This should be tuned for
# tabletop object scale, not for full-scene registration.
object_geometry_icp_voxel_size: 0.01
# Maximum correspondence distance for the hybrid alignment stage.
object_geometry_icp_distance_threshold: 0.02
# Minimum number of downsampled points required in both clouds for hybrid ICP.
object_geometry_icp_min_points: 20
# Hybrid merge is accepted only if all quality gates below are satisfied.
object_geometry_merge_min_fitness: 0.85
object_geometry_merge_max_rmse: 0.01
object_geometry_merge_max_centroid_shift: 0.015


# -------------------------------------------------------
# MATCHING / TRACKING CONFIG
# -------------------------------------------------------
# These parameters control how new frame-level detections are associated
# with existing tracked objects in the local map. The tracker computes:
#   total_similarity = spatial_similarity + visual_similarity
# where spatial_similarity is the overlap ratio of 3D point clouds (0 to 1)
# and visual_similarity is the CLIP cosine similarity (0 to 1).
# A detection is matched to an existing object only if total_similarity > sim_threshold.
#
# CRITICAL: If the 3D bounding boxes of two observations do not overlap at all
# (e.g. after a large rotation), spatial_similarity = 0 and the match depends
# entirely on visual_similarity. Since CLIP cosine similarity rarely exceeds ~0.95,
# a sim_threshold > 1.0 effectively REQUIRES spatial overlap for a match.
# Example: Lower sim_threshold to 0.8 to allow visual-only matching (more aggressive,
# risk of merging visually similar but distinct objects like two identical chairs).

# Combined similarity threshold for matching new detections to existing objects.
# sim = spatial_overlap_ratio + clip_cosine_similarity. Must exceed this to match.
sim_threshold: 1.05

# Enforce one-to-one local association so the same map object cannot absorb
# multiple observations from the same frame.
local_one_to_one_matching: true

# Tracking specific settings
# Centroid distance threshold (in metres) used for temporal tracking association.
tracking_centroid_dist: 0.02
# Centroid distance threshold (in metres) used for map cleanup (merge_local_map).
merging_centroid_dist: 0.05
# Multiplier for downsample_voxel_size to determine the FAISS search radius.
# This radius is used for 3D point cloud overlap calculation.
faiss_radius_factor: 3.0
# Maximum distance (in metres) from the camera to accept a new detection.
# Objects beyond this distance are discarded early to save computation and avoid depth noise.
max_detection_distance: 1.0

# Mobility thresholds
# Objects are classified as "low mobility" (static, e.g. furniture) or
# "high mobility" (movable, e.g. people). This affects their lifecycle.
mobility:
  # Delta added/subtracted to compare low-mobility vs high-mobility CLIP similarity
  similarity_delta: 0.05
  # CLIP descriptor similarity threshold for classifying an object as low/high mobility
  descriptor_threshold: 0.45

# Object matching thresholds (used for 2D bounding box matching refinement)
object_matching:
  # Minimum 2D bounding box intersection-over-union ratio for a preliminary match
  overlap_ratio: 0.8
  # Maximum score difference between two candidate matches for ambiguity resolution
  score_difference: 0.1

# Object tracking thresholds (used when updating global map observations)
object_tracking:
  # Minimum similarity required to update an existing global object with a new observation
  max_similarity: 0.8
  # Reject local matches between detections with extremely different bbox volumes
  # unless they also have meaningful spatial overlap.
  max_bbox_volume_ratio: 4.0

# On-relation check thresholds (spatial "object A is on top of object B" detection)
on_relation:
  # Maximum vertical distance (in metres) between the support plane of one object
  # and the base of another to classify them as having an "on" relation.
  plane_distance: 0.1


# -------------------------------------------------------
# KEYFRAME CONFIG
# -------------------------------------------------------
# These parameters control how often the system processes a new frame for detection.
# Only frames that differ sufficiently from the previous keyframe (in time, translation,
# or rotation) are processed. Tightening these thresholds produces more keyframes
# (better coverage but slower). Loosening them produces fewer keyframes (faster but
# may miss objects seen briefly).
# Example: For a slow-moving robot, increase pose_threshold to 0.3 to skip
# near-identical frames. For a fast-spinning robot, decrease rotation_threshold
# to 2 to capture more rotational views.

# Minimum time interval (in seconds) between consecutive keyframes
time_threshold: 0.5
# Minimum translation (in metres) between consecutive keyframes
pose_threshold: 0.1
# Minimum rotation (in degrees) between consecutive keyframes
rotation_threshold: 3



# -------------------------------------------------------
# LOCAL OBJECTS CONFIG (Concrete Objects Lifecycle)
# -------------------------------------------------------
# These parameters govern the lifecycle of tracked objects in the local map.
# Each detected object goes through: UPDATING → PENDING → STABLE/ELIMINATION.
# The lifecycle determines when an object is considered confirmed (stable),
# when it should be split (if labels oscillate), and when it should be removed.
#
# Example: If objects disappear too quickly, increase max_pending_count.
# If duplicate labels (e.g. "armchair" and "office chair") create two objects
# for the same physical thing, lower stable_num so each reaches stability faster,
# then rely on merge_local_map to fuse them post-hoc.

# Size of the sliding window (in keyframe indices) for object lifecycle tracking.
# While an object's latest observation falls within this window, it stays in UPDATING status.
# Also controls the split detection window: if an object oscillates between two class labels
# within this window, it is flagged for splitting.
# Also determines the duration of the end_process loop: end_range = active_window_size + max_pending_count + 1.
active_window_size: 10
# How often (in number of observations) to apply voxel downsampling to an object's
# accumulated point cloud. Lower values = more frequent downsampling = smaller clouds
# but potential loss of detail. E.g., 3 means downsample every 3rd observation.
downsample_interval: 3
# Threshold for the split detection mechanism. If an object receives detections
# with two different class labels for more than max_common_th frames within the
# active window, it is split into two separate objects.
# Example: A "couch" with a "pillow" on it may oscillate between labels.
max_common_th: 6
# Disable local split for tabletop/offline rosbag mapping. Instance continuity is
# handled by one-to-one tracking and end-process dedupe instead.
enable_local_split: false
# Maximum number of keyframes an unstable object can remain in PENDING status
# (not being detected) before it is eliminated from the local map.
# Also controls how long a STABLE object waits in WAITING status before
# being promoted to the global map. Increase to give objects more time to reappear.
max_pending_count: 5
# Minimum number of observations required for an object to be considered stable.
# An object must be detected in at least this many keyframes AND have a dominant
# class label (>1/3 of observations) or pass Bayesian convergence to become stable.
# Higher values = more confident objects but risk losing briefly-seen items.
# Lower values = faster confirmation but more false positives.
stable_num: 3


# -------------------------------------------------------
# GLOBAL OBJECTS CONFIG (Anchor Objects)
# -------------------------------------------------------
# The global map stores long-term, confirmed objects (anchors).
# Once a local object reaches stability and is promoted, it becomes a global object.

# If True, global objects are never updated with new observations (frozen map).
# Useful for evaluation or when the global map is preloaded and should not change.
no_update: False
# If False, keep all promoted objects in the local map until end_process and
# update the global map only once at the end of the rosbag/offline run.
promote_global_during_run: false


# -------------------------------------------------------
# END PROCESS CONFIG
# -------------------------------------------------------
# Controls system shutdown behaviour. When enabled, the system will flush
# all remaining local objects through the lifecycle, promote them to global,
# save maps to disk, and shut down cleanly.
# In ROS mode, end_process is triggered automatically after a configurable
# period of no new sensor data.

# Enable clean shutdown with map saving and time cost calculation
use_end_process: True
# Run a final conservative dedupe over residual local-map fragments before
# promoting them to the global map. Useful for absorbing tiny FastSAM remnants
# that survived tracking and the main end-process dedupe.
end_process_residual_dedupe_enabled: true
# Maximum number of 3D points for an object to be considered a residual fragment
# in the final dedupe pass above.
end_process_fragment_max_points: 80


# -------------------------------------------------------
# PARALLELISATION
# -------------------------------------------------------
# Controls whether detection and feature extraction run in parallel threads.
# Disable for easier debugging or on systems with limited CPU cores.

# Use parallel processing (False = sequential, easier to debug)
use_parallel: True


# ============================================================
# SYSTEM MAPPING CONFIG
# ============================================================

# -------------------------------------------------------
# GENERAL MAP CONFIG
# -------------------------------------------------------
# These settings control how the final map is constructed and saved.
# DualMap supports two map levels: local (concrete objects) and global (anchor objects).
# The merge feature fuses duplicate objects detected from different viewpoints.
#
# Example: Enable merge_local_map and lower merge_sim_threshold to 0.5 to
# aggressively merge objects that share even moderate point cloud overlap,
# useful when the same object is labelled differently across frames
# (e.g. "armchair" vs "office chair").

# If True, run local mapping only and get local map (skip global map construction).
# If False, run both local and global mapping and get global map.
run_local_mapping_only: False
# Post-hoc 3D-level merging between local objects before saving.
# When enabled, objects with overlapping point clouds are detected and fused
# into a single object during end_process, similar to ConceptGraphs and HOV-SG.
# This fixes duplicate objects that the real-time tracker failed to associate
# (e.g. same chair seen from two very different angles).
merge_local_map: False
# Minimum point cloud overlap ratio (0.0 to 1.0) required to merge two objects.
# Lower values merge more aggressively (more duplicates removed but risk merging
# distinct nearby objects). Higher values are conservative (only near-identical clouds).
merge_sim_threshold: 0.8

# Map objects saving directory
map_save_path: ${output_path}/${dataset_name}_${scene_id}/map
# Save the generated local map to disk as .pkl files
save_local_map: True
# Save the global map to disk (set False if run_local_mapping_only is True)
save_global_map: False

# DEBUG: save cropped RGB images for every detected object. Useful for
# inspecting what the detector sees, but generates many small image files.
save_cropped: False


# -------------------------------------------------------
# LAYOUT CONFIG
# -------------------------------------------------------
# Layout mapping builds a dense point cloud of the environment structure
# (walls, floor, ceiling) separately from object detection. This is used
# for navigation and spatial reasoning.
# Example: Increase layout_voxel_size from 0.05 to 0.10 for a lighter
# layout cloud. Increase layout_rotation_threshold to skip layout updates
# during small rotational movements.

# Voxel size (in metres) for the layout point cloud. Controls density of the structural map.
layout_voxel_size: 0.05
# Save the layout point cloud to disk
save_layout: True
# Minimum translation (in metres) between consecutive layout keyframes
layout_translation_threshold: 0.3
# Minimum rotation (in degrees) between consecutive layout keyframes
layout_rotation_threshold: 10.0

# -------------------------------------------------------
# SUPPORT SURFACE FILTER
# -------------------------------------------------------
# Filters large flat masks that correspond to the table/support plane or
# regions mixing table + objects. These detections are marked as non-trackable
# and are excluded from object tracking.
support_surface_filter:
  enabled: false
  max_image_area_ratio: 0.20
  max_z_extent: 0.03
  min_xy_extent: 0.15
  max_plane_distance: 0.02
  min_plane_ratio: 0.70

# ============================================================
# PRELOADING CONFIG
# ============================================================
# These settings allow loading a previously generated map or layout
# to continue mapping from a known state, or for evaluation/visualisation.

# Preload an existing global map from disk (objects with CLIP features and point clouds)
preload_global_map: False

# Preload an existing layout pcd and wall pcd from disk.
# If preloaded, the layout building thread will be disabled (no new layout data added).
preload_layout: False

# Path to preload map data from. If empty, the system uses the default output path.
preload_path: ""
# preload path example:
# preload_path: "output/map_results/replica_room_0/map"

# Preload pre-recorded action/navigation paths for visualisation
use_given_path: False
given_path_dir: ""


# ============================================================
# ACTIONS CONFIG
# ============================================================
# These settings control the action monitoring system, which watches
# an external YAML file for incoming robot commands (e.g. navigation goals).

# Path to the actions configuration file that the system monitors for changes
config_file_path: config/actions.yaml
# Polling interval (in seconds) for checking the actions file for updates.
# Lower values = more responsive but higher CPU usage.
monitor_interval: 0.1

# Enable interactive wall editing mode (for correcting wall segmentation manually)
edit_wall: False
# Save edited wall geometry to disk
save_wall: False
